<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   role="img"
   aria-labelledby="title"
   id="svg3"
   sodipodi:docname="128.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview3"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="5.6568542"
     inkscape:cx="52.325902"
     inkscape:cy="41.542523"
     inkscape:window-width="1920"
     inkscape:window-height="1011"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="translation-layer" />
  <title
     id="title">YouTube Subtitle Translator</title>
  <desc
     id="desc1">A white translation speech bubble overlaps the upper-right corner of a red YouTube button, casting a shadow onto it, with its tail pointing down toward the play triangle.</desc>
  <defs
     id="defs3">
    <filter
       id="button-shadow"
       inkscape:label="Soft YouTube button shadow"
       filterUnits="userSpaceOnUse"
       x="0"
       y="0"
       width="128"
       height="128"
       color-interpolation-filters="sRGB">
      <feGaussianBlur
         in="SourceAlpha"
         stdDeviation="1.3"
         result="blur"
         id="feGaussianBlur1" />
      <feOffset
         in="blur"
         dy="2"
         result="offset-shadow"
         id="feOffset1" />
      <feFlood
         flood-color="#000000"
         flood-opacity="0.25"
         result="shadow-colour"
         id="feFlood1" />
      <feComposite
         in="shadow-colour"
         in2="offset-shadow"
         operator="in"
         result="shadow"
         id="feComposite1" />
      <feMerge
         id="feMerge2">
        <feMergeNode
           in="shadow"
           id="feMergeNode1" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode2" />
      </feMerge>
    </filter>
    <filter
       id="bubble-shadow"
       inkscape:label="Speech bubble shadow onto YouTube button"
       filterUnits="userSpaceOnUse"
       x="0"
       y="0"
       width="128"
       height="128"
       color-interpolation-filters="sRGB">
      <feGaussianBlur
         in="SourceAlpha"
         stdDeviation="1.6"
         result="blur"
         id="feGaussianBlur2" />
      <feOffset
         in="blur"
         dx="-2"
         dy="3"
         result="offset-shadow"
         id="feOffset2" />
      <feFlood
         flood-color="#000000"
         flood-opacity="0.3"
         result="shadow-colour"
         id="feFlood2" />
      <feComposite
         in="shadow-colour"
         in2="offset-shadow"
         operator="in"
         result="shadow"
         id="feComposite2" />
      <feMerge
         id="feMerge4">
        <feMergeNode
           in="shadow"
           id="feMergeNode3" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode4" />
      </feMerge>
    </filter>
  </defs>
  <g
     inkscape:groupmode="layer"
     inkscape:label="1 · YouTube red background"
     id="background-layer" />
  <g
     inkscape:groupmode="layer"
     inkscape:label="2 · White play triangle"
     id="triangle-layer">
    <!-- Triangle from https://www.youtube.com/ (yt-ringo2-svg).
         Scale the 29-unit-wide logo uniformly to the 104px button width,
          with its vertical centre at y=80. -->
    <g
       id="g4"
       transform="translate(-2,8)">
      <rect
         id="video-background"
         inkscape:label="Rounded video tile"
         x="4"
         y="44"
         width="104"
         height="72"
         rx="18"
         fill="#ff0033"
         filter="url(#button-shadow)" />
      <path
         id="play-triangle"
         inkscape:label="White play triangle"
         d="M 19,10 11.5,5.75 v 8.5 z"
         transform="matrix(3.586207,0,0,3.586207,4,44.13793)"
         fill="#ffffff"
         style="fill:#ffffff;fill-opacity:1" />
    </g>
  </g>
  <g
     inkscape:groupmode="layer"
     inkscape:label="3 · Speech bubble · tail toward play triangle"
     id="bubble-layer">
    <path
       id="translation-bubble"
       inkscape:label="Speech bubble (edit tail nodes independently)"
       d="m 64.717941,1.3328035 h 47.999999 a 14,14 0 0 1 14,14.0000005 v 28 a 14,14 0 0 1 -14,14 H 84.717941 l -23,11 5,-11 h -2 a 14,14 0 0 1 -14,-14 v -28 a 14,14 0 0 1 14,-14.0000005 z"
       fill="#ffffff"
       stroke="#3c3c3c"
       stroke-width="2.5"
       stroke-linejoin="round"
       filter="url(#bubble-shadow)"
       style="stroke-linejoin:miter"
       transform="matrix(1.0703125,0,0,1.0703125,-9,0)" />
  </g>
  <g
     inkscape:groupmode="layer"
     inkscape:label="4 · Translation symbol inside bubble"
     id="translation-layer">
    <g
       id="translation-symbol"
       inkscape:label="Translation lettering (edit these paths)"
       transform="matrix(2.0268891,0,0,2.0268891,30.110561,-6.9515695)"
       fill="none"
       stroke="#3c3c3c"
       stroke-width="2.8"
       stroke-linecap="round"
       stroke-linejoin="round"
       style="stroke:#3c3c3c;stroke-width:2.79983;stroke-dasharray:none;stroke-opacity:1">
      <path
         id="letter-A"
         inkscape:label="Latin A"
         d="M 27.5,30.0717 33.633904,14.711007 40.5,30.0717 38.367326,25.300414 29.894628,25.287156"
         style="stroke:#3c3c3c;stroke-width:2.79983;stroke-dasharray:none;stroke-opacity:1" />
      <path
         id="chinese-symbol"
         inkscape:label="Chinese 文"
         d="m 14.58206,23.144884 c 4.908783,-2.184207 10.053208,-4.565392 11.977289,-12.832637 h 2.578876 -6.329968 L 21.681334,7.5 l 1.126923,2.812247 h -8.674401 3.047762 c 0.81717,4.320332 2.87035,8.517354 9.139134,11.550866"
         style="stroke:#3c3c3c;stroke-width:2.79983;stroke-dasharray:none;stroke-opacity:1" />
    </g>
  </g>
</svg>
