name: Tests

on:
  push:
    branches: [ master ]
    paths:
      - '**/*.ts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - '__tests__/fixtures/**'
      - 'icons/**'
      - 'tsconfig.json'
      - '.github/workflows/tests.yml'
      - '.github/workflows/youtube-live.yml'
      - '.github/actions/setup/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - '__tests__/fixtures/**'
      - 'icons/**'
      - 'tsconfig.json'
      - '.github/workflows/tests.yml'
      - '.github/workflows/youtube-live.yml'
      - '.github/actions/setup/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test
  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            binary: chrome
          - browser: firefox
            binary: firefox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install browser
        run: npx puppeteer browsers install ${{ matrix.binary }}
      - run: npm run test-browser:${{ matrix.browser }}
